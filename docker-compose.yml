services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "bot.main"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
